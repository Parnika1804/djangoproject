<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In</title>
  <style>
    body {
      background-color: #d95550;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 24px;
    }

    .controls button {
      background: #c04c47;
      border: none;
      color: white;
      padding: 8px 12px;
      margin-left: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .form-container {
      background-color: #b9413c;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-container label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: none;
    }

    .form-container button {
      width: 100%;
      padding: 12px;
      background-color: white;
      color: #d95550;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .form-container button:hover {
      background-color: #f5f5f5;
    }

    .errorlist {
      color: #ffdddd;
      list-style: none;
      padding: 0;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<header>
  <a href="{% url 'home' %}" style="text-decoration: none; color: white;">
    <h1>✔️Pomofocus</h1>
  </a>
  <div class="controls">
    {% if user.is_authenticated %}
      <a href="{% url 'logout' %}"><button>Log Out</button></a>
    {% else %}
      <a href="{% url 'signup' %}"><button>Sign Up</button></a>
      <a href="{% url 'login' %}"><button>Log In</button></a>
    {% endif %}
  </div>
</header>

<div class="form-container">
  <h2>Log In</h2>
  <form method="POST">
    {% csrf_token %}

    {{ form.non_field_errors }}

    <label for="{{ form.username.id_for_label }}">Username</label>
    {{ form.username }}
    {{ form.username.errors }}

    <label for="{{ form.password.id_for_label }}">Password</label>
    {{ form.password }}
    {{ form.password.errors }}

    <button type="submit">Log In</button>
  </form>
</div>

</body>
</html>
